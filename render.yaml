services:
  - type: web
    name: texas-holdem
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: poker-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: poker-db
    plan: free
